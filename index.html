<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body{background:black;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
        h1{color:white;font-size:80px}
        .btn{position:fixed;top:20px;left:20px;background:#2196F3;color:white;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:14px}
    </style>
</head>
<body>
<h1>مرحباً</h1>
<div class="btn" id="btn">📱 تنزيل</div>
<script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
let dp;const btn=document.getElementById('btn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;});
btn.onclick=()=>{if(dp){dp.prompt();}};
</script>
</body>
</html>
